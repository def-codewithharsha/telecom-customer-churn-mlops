project:
  name: telecom-customer-churn
  random_seed: 42

data:
  raw_path: data/raw/churn.csv
  target_column: Churn

training:
  test_size: 0.2
  # F2 weights churn recall more than precision; this is a project assumption.
  threshold_beta: 2.0
  # Sigmoid suits this binary, imbalanced dataset; isotonic can overfit small samples.
  calibration_method: sigmoid
  model_path: models/churn_model.skops

# Starter release policy based on current full-dataset results; review against
# business costs and a frozen production evaluation set before real promotion.
quality_gates:
  min_cv_average_precision: 0.60
  min_holdout_average_precision: 0.55
  min_improvement_over_baseline: 0.05

logging:
  level: INFO

