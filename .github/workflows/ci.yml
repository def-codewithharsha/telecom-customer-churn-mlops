name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Check code style
        run: ruff check src

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Create synthetic CI dataset
        run: python scripts/create_ci_dataset.py

      - name: Run training smoke check
        run: |
          python -m telecom_churn.train
          python -c "from pathlib import Path; p=Path('models/churn_model.joblib'); assert p.is_file() and p.stat().st_size > 0, 'Model bundle was not created'"