name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELECOM_CHURN_CONFIG: configs/dev.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Check code style
        run: ruff check src scripts tests

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Run automated tests
        run: pytest -q

      - name: Create synthetic CI dataset
        run: python scripts/create_ci_dataset.py

      - name: Run training smoke check
        run: |
          python -m telecom_churn.train
          python -c "import json; from pathlib import Path; p=Path('models/churn_model.skops'); m=Path('models/churn_model.json'); d=json.loads(m.read_text()); assert p.is_file() and p.stat().st_size > 0 and len(d.get('artifact_sha256','')) == 64, 'Safe model artifact or digest metadata was not created'"
          
      - name: Build container smoke image
        run: docker build --pull -t telecom-churn-ci:${{ github.sha }} .

      - name: Start container and check health endpoints
        run: |
          docker run --detach --name telecom-churn-ci --publish 127.0.0.1:8080:8080 telecom-churn-ci:${{ github.sha }}
          test "$(docker inspect --format='{{.Config.User}}' telecom-churn-ci)" = "10001:10001"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs telecom-churn-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ready
